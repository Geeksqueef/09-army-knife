<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>20xxscape Wiki Reader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <header>
        <h1>20xxscape WIKI READER</h1>
        <p id="ref-display" class="subtitle">Find period-accurate RuneScape wiki articles (before 2011-04-01)</p>
        
       <div class="top-nav">
    <a href="https://github.com/20xxscape-wiki/20xxscape-wiki.github.io" target="_blank" class="icon-btn" title="View Source on GitHub">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.042-1.416-4.042-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
    </a>
    <button id="theme-toggle" class="icon-btn" title="Toggle Theme">☀️</button>
    <button id="settings-toggle" class="icon-btn" title="Settings">⚙️</button>
</div>
    </header>

    <main class="app-container">
        <!-- Main Search Area -->
        <section class="search-section">
            <div class="tabs">
                <button class="tab-btn active" data-tab="wiki-search">Wiki Search</button>
                <button class="tab-btn" data-tab="find-earliest">Find Earliest</button>
            </div>

            <div id="search-panel" class="panel">
                <div class="input-row">
                    <input type="text" id="search-input" placeholder="Search archives...">
                    <button id="search-btn">Search</button>
                </div>

                <!-- Find Earliest Specific Inputs -->
                <div id="earliest-extras" class="hidden">
                    <input type="text" id="find-text" placeholder="Text to find" style="margin-top: 10px;">
                    <div class="checkbox-row">
                        <label><input type="checkbox" id="regex-chk"> Regex</label>
                        <label><input type="checkbox" id="raw-chk"> Raw wikitext</label>
                        <input type="number" id="start-rev" placeholder="Starting rev ID (optional)" style="width: 160px;">
                    </div>
                </div>
            </div>

            <!-- Place this inside <section class="search-section">, just above <div id="results-area"> -->
<div id="quest-hud" class="hidden">
    <div class="hud-header">
        <h2 id="hud-title">Quest Name</h2>
        <button id="close-hud" class="icon-btn">✕</button>
    </div>
    <div class="hud-grid">
        <div class="hud-box">
            <h4><span class="hud-icon">📊</span> Requirements</h4>
            <ul id="hud-reqs"></ul>
        </div>
        <div class="hud-box">
            <h4><span class="hud-icon">🎒</span> Items Needed</h4>
            <ul id="hud-items"></ul>
        </div>
    </div>
</div>
            
            <!-- Output results here -->
            <div id="results-area"></div>
        </section>

        <!-- Sidebar Area -->
        <aside class="sidebar">
            <div class="side-tabs">
                <button class="side-tab active" id="show-bookmarks">Bookmarks</button>
                <button class="side-tab" id="show-history">History</button>
                <button class="side-tab" id="show-changelog">Changelog</button>
            </div>
            
            <div id="side-list" class="side-content">
                <!-- Populated by app.js -->
            </div>
        </aside>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>SETTINGS</h3>
            <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
            <div class="setting-group">
                <label>Reference Date</label>
                <div class="date-input-wrapper" style="display: flex; gap: 8px;">
                    <input type="date" id="ref-date" value="2011-04-01">
                    <button id="reset-date" class="icon-btn">Reset</button>
                </div>
            </div>
            <button id="close-settings" class="primary-btn">Done</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
