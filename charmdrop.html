        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;

            margin: 0;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            color: #F2C848;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 1);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #2a1a0a;
            border: 2px solid #5c4a2a;
            border-radius: 10px;
            padding: 20px;
            position: relative;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th, td {
            border: 1px solid #5c4a2a;
            padding: 12px;
            text-align: left;
        }
        
        th {
            background-color: #6B5028;
            color: #F2C848;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 1);
            position: relative;
        }
        
        th:hover {
            background-color: #5c4a2a;
        }
        
        th::after {
            content: ' ↕';
            font-size: 0.8em;
            margin-left: 5px;
        }
        
        tr:nth-child(even) {
            background-color: #3d2a1a;
        }
        
        tr:hover {
            background-color: #4d3a2a;
        }
        
        .high-chance {
            color: #00ff00;
            font-weight: bold;
        }
        
        .medium-high-chance {
            color: #7fff00;
        }
        
        .medium-chance {
            color: #ffff00;
        }
        
        .medium-low-chance {
            color: #ff7f00;
        }
        
        .low-chance {
            color: #ff0000;
        }
        
        .search-box {
            margin: 20px 0;
            padding: 10px;
            background-color: #3d2a1a;
            border: 1px solid #5c4a2a;
            border-radius: 5px;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px;
            background-color: #2a1a0a;
            border: 1px solid #5c4a2a;
            color: #f0f0f0;
            border-radius: 3px;
            font-size: 14px;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #F2C848;
        }
        
        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: #2a1a0a;
            color: #F2C848;
            text-decoration: none;
            border: 1px solid #5c4a2a;
            border-radius: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 1);
        }
        
        .back-button:hover {
            background-color: #5c4a2a;
            color: #ffffff;
        }
        
        .npc-link {
            color: #F2C848;
            text-decoration: underline;
            cursor: pointer;
        }
        
        .npc-link:hover {
            color: #ffffff;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #1a0f0a;
            background-color: #d4b896;
            border: 2px solid #5c4a2a;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 5px;
        }
        
        .close-btn:hover {
            background-color: #c4a886;
        }
    </style>

        function getChanceColor(chance) {
            if (chance >= 50) return 'high-chance';
            if (chance >= 30) return 'medium-high-chance';
            if (chance >= 20) return 'medium-chance';
            if (chance >= 10) return 'medium-low-chance';
            return 'low-chance';
        }

        function formatChance(chance) {
            return chance.toFixed(1) + '%';
        }

        function populateTable() {
            const tbody = document.getElementById('charmTableBody');
            tbody.innerHTML = '';
            
            charmData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="npc-link" data-npc-name="${encodeURIComponent(row.npc)}">${row.npc}</span></td>
                    <td>${row.combat}</td>
                    <td class="${getChanceColor(row.gold)}">${formatChance(row.gold)}</td>
                    <td class="${getChanceColor(row.green)}">${formatChance(row.green)}</td>
                    <td class="${getChanceColor(row.crimson)}">${formatChance(row.crimson)}</td>
                    <td class="${getChanceColor(row.blue)}">${formatChance(row.blue)}</td>
                    <td>${row.perDrop}</td>
                `;
                tbody.appendChild(tr);
            });

            // Add event listeners to all npc-link elements
            document.querySelectorAll('.npc-link').forEach(link => {
                link.addEventListener('click', function() {
                    const npcName = decodeURIComponent(this.getAttribute('data-npc-name'));
                    openNpcViewer(npcName);
                });
            });
        }

        let sortDirection = {};

        function sortTable(columnIndex) {
            const table = document.getElementById('charmTable');
            const tbody = document.getElementById('charmTableBody');
            const rows = Array.from(tbody.rows);
            
            sortDirection[columnIndex] = sortDirection[columnIndex] === 'asc' ? 'desc' : 'asc';
            
            rows.sort((a, b) => {
                let aText = a.cells[columnIndex].textContent.trim();
                let bText = b.cells[columnIndex].textContent.trim();
                
                // Handle numeric sorting for percentage columns
                if (columnIndex >= 2 && columnIndex <= 5) {
                    aText = parseFloat(aText);
                    bText = parseFloat(bText);
                } else if (columnIndex === 6) {
                    aText = parseInt(aText);
                    bText = parseInt(bText);
                }
                
                if (typeof aText === 'number' && typeof bText === 'number') {
                    return sortDirection[columnIndex] === 'asc' ? aText - bText : bText - aText;
                }
                
                return sortDirection[columnIndex] === 'asc' 
                    ? aText.localeCompare(bText) 
                    : bText.localeCompare(aText);
            });
            
            rows.forEach(row => tbody.appendChild(row));
        }

        function filterTable() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase();
            const tbody = document.getElementById('charmTableBody');
            const rows = tbody.getElementsByTagName('tr');
            
            for (let i = 0; i < rows.length; i++) {
                const npcName = rows[i].cells[0].textContent.toLowerCase();
                if (npcName.includes(filter)) {
                    rows[i].style.display = '';
                } else {
                    rows[i].style.display = 'none';
                }
            }
        }

        function openNpcViewer(npcName) {
            // Send message to parent window to open NPC viewer with this NPC
            if (window.parent) {
                window.parent.postMessage({
                    type: 'openNpcViewer',
                    npcName: npcName
                }, '*');
            }
        }

        function closePage() {
            // Send message to parent window to close this popup
            if (window.parent) {
                window.parent.postMessage({
                    type: 'closePopup'
                }, '*');
            }
        }

        populateTable();
