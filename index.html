<div id="fairy-rings-popup">
  <button class="close-btn" onclick="toggleFairyRings()">&times;</button>
  <h2>Fairy Ring Codes</h2>
  <table>
    <thead>
      <tr>
        <th onclick="sortTable(0)">Ring Code</th>
        <th onclick="sortTable(1)">Destination</th>
      </tr>
    </thead>
    <tbody id="fairy-rings-body">
    </tbody>

<script>
const fairyRingData = [
  ["A I Q", "Mudskipper point"],
  ["A I R", "Necromancer Island"],
  ["A J Q", "Dungeons: Cave south of Dorgesh-Kaan"],
  ["A J R", "Kandarin: Slayer cave"],
  ["A J S", "Penguin Island"],
  ["A K Q", "Kandarin: Piscatoris Hunter"],
  ["A K S", "Feldip Hills"],
  ["A L R", "Abyssal Area"],
  ["A L Q", "Morytania Haunted Woods"],
  ["A L S", "McGrubor's Wood"],
  ["B I P", "Morytania Island"],
  ["B I Q", "Kalphite Lair"],
  ["B I S", "Ardougne Zoo Unicorns"],
  ["B K P", "Castle Wars"],
  ["B K Q", "Enchanted Valley"],
  ["B K R", "Mort Myre Swamp"],
  ["B L P", "TzHaar Area"],
  ["B L R", "Legends Guild"],
  ["C I P", "Islands: Miscellania"],
  ["C I Q", "Yanille"],
  ["C J R", "Sinclair West"],
  ["C K P", "Cosmic Entity's Plane"],
  ["C K R", "Karamja Hunter"],
  ["C K S", "Canafis"],
  ["C K S", "Near Canifis"],
  ["C L S", "Jungle Spiders"],
  ["D I S", "Wizards Tower"],
  ["D J P", "Tower of Life"],
  ["D J R", "Sinclair North West"],
  ["D K P", "East Karamja"],
  ["D K R", "Edgeville/GE"],
  ["D K S", "Kandarin: Snowy Hunter Area"],
  ["D L Q", "Desert Lizard"],
  ["D L R", "Poison Wastes"]
];

function populateFairyRings() {
  const tbody = document.getElementById('fairy-rings-body');
  tbody.innerHTML = '';
  fairyRingData.forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${row[0]}</td><td>${row[1]}</td>`;
    tbody.appendChild(tr);
  });
}

function toggleFairyRings() {
  const popup = document.getElementById('fairy-rings-popup');
  const overlay = document.getElementById('fairy-rings-overlay');
  if (popup.style.display === 'block') {
    popup.style.display = 'none';
    overlay.style.display = 'none';
  } else {
    populateFairyRings();
    popup.style.display = 'block';
    overlay.style.display = 'block';
  }
}

let sortDirection = 0;

function sortTable(columnIndex) {
  const table = document.getElementById('fairy-rings-body');
  const rows = Array.from(table.rows);
  
  sortDirection = sortDirection === 0 ? 1 : -sortDirection;
  
  rows.sort((a, b) => {
    const aText = a.cells[columnIndex].textContent.trim();
    const bText = b.cells[columnIndex].textContent.trim();
    return aText.localeCompare(bText) * sortDirection;
  });
  
  rows.forEach(row => table.appendChild(row));
}

populateFairyRings();
</script>
