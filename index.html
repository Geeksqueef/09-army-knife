<!DOCTYPE html>
<html>
<head>
  <title>2009Scape Swiss Army Knife</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./dashboard.css">
</head>
<body>
  <iframe id="map-frame" src="./worldmap.html"></iframe>

  <nav class="dashboard-toolbar">
    <button class="dashboard-btn new" onclick="togglePanel('fairy-rings')">Fairy Rings<span class="new-banner">NEW!</span></button>
    <button class="dashboard-btn new" onclick="togglePanel('skill-calc')">Skill Calc<span class="new-banner">NEW!</span></button>
    <button class="dashboard-btn new" onclick="togglePanel('charm-drop')">Charm Drop Rates<span class="new-banner">NEW!</span></button>
    <button class="dashboard-btn" onclick="togglePanel('shop-viewer')">Shop Viewer</button>
    <button class="dashboard-btn" onclick="togglePanel('droptables')">Droptables</button>
    <button class="dashboard-btn" onclick="togglePanel('npc-viewer')">NPC Viewer</button>
    <button class="dashboard-btn" onclick="togglePanel('npc-3d')">3D NPC</button>
    <button class="dashboard-btn" onclick="openWiki()">2009scape Wiki</button>
    <button class="dashboard-btn" onclick="openRsWikiReader()">RS Wiki Reader</button>
    <button class="dashboard-btn" onclick="toggleMaximizeMap()" title="Hide all panels and fill screen with the map">Maximize Map</button>
  </nav>

  <button class="dashboard-btn restore-btn" onclick="toggleMaximizeMap()">Show Toolbar</button>

  <div class="maximize-hint">Tip: click any toolbar button to open a tool panel over the map.</div>

  <script src="./dashboard.js"></script>
</body>
</html>
